<!DOCTYPE html>
<!-- Owner-supplied Qwen glass renderer adapted to a single HyperChat wordmark entrance.
     Neutral/copper refraction, bounded playback, no wordmark formation. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HyperChat introduction</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #f3ede2; overflow: hidden; }
  #stage {
    position: fixed; inset: 0;
    background: #f3ede2;
    cursor: default; user-select: none; -webkit-user-select: none;
  }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 95% at 50% 42%, rgba(0,0,0,0) 55%, rgba(32,25,20,.075) 100%);
  }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 26px;
    text-align: center; pointer-events: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 10px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase;
    color: rgba(32, 25, 20, .38);
    opacity: 0; animation: hintIn 1.1s 1.4s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes hintIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #stage.css-fallback { display: flex; align-items: center; justify-content: center; }
  #stage.css-fallback svg { width: min(70%, 820px); height: auto; animation: hcPop 1.1s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes hcPop {
    0% { opacity: 0; transform: scale(.55); filter: blur(14px); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="HyperChat glass wordmark"></div>
<div class="vignette"></div>


<script>
"use strict";
var S = {
  tileSize: 560, logoScale: 0.68, finalScale: 1.0, logoOffset: [0, 0],
  iconPlate: false, keepPlate: false, originalColors: true,
  opticalDepth: 1.1, dispersion: 0, colorBleed: 0, doubleBevel: 1, bevelWidth: 0.14, corner: 4.8,
  cornerPull: 2.1, cornerWidth: 2.2, cornerFocus: 0.58, edgeSmear: 2.85, stretch: 0, tilt: 0.35, bulge: 1,
  specular: 1, halo: 0, shadow: 1, ripple: 1,
  bounce: 0, response: 0.42, startSize: 0.22, startZoom: 1.9, glide: 2.2, present: 4.7,
  drift: 0.12, swell: 0.5, focus: 1, sheen: 1, lightTurn: 0.9,
  hold: 1.6, background: "#f3ede2", plateColor: "#ffffff", logoColor: "#221f1c"
};

/* Stage A — joined HC monogram (one connected shape) */
var LOGO_A = ""; // Supplied by the parent from the shared, neutral HC vector.

/* ---------------- logo → texture + SDF ---------------- */
var TEX = window.innerWidth <= 600 ? 768 : 1024, BOX = 0.75;
function svgToUrl(text) {
  var svg = new DOMParser().parseFromString(text, "image/svg+xml").documentElement;
  var w = parseFloat(svg.getAttribute("width") || ""), h = parseFloat(svg.getAttribute("height") || "");
  var vb = (svg.getAttribute("viewBox") || "").split(/[\s,]+/).map(Number);
  if (vb.length === 4 && vb[2] > 0 && vb[3] > 0) { w = vb[2]; h = vb[3]; }
  if (!(w > 0 && h > 0)) w = h = 100;
  var s = TEX / Math.max(w, h);
  svg.setAttribute("width", String(Math.round(w * s)));
  svg.setAttribute("height", String(Math.round(h * s)));
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
}
function fitToTexture(source, sw, sh) {
  var tmp = document.createElement("canvas"); tmp.width = tmp.height = TEX;
  var tc = tmp.getContext("2d", { willReadFrequently: true });
  var s0 = Math.min(TEX / sw, TEX / sh), dx0 = (TEX - sw * s0) / 2, dy0 = (TEX - sh * s0) / 2;
  tc.drawImage(source, dx0, dy0, sw * s0, sh * s0);
  var d = tc.getImageData(0, 0, TEX, TEX).data;
  var x0 = TEX, y0 = TEX, x1 = -1, y1 = -1;
  for (var y = 0; y < TEX; y++) for (var x = 0; x < TEX; x++) {
    var i = (y * TEX + x) * 4;
    if (d[i + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }

  var bw = x1 - x0 + 1, bh = y1 - y0 + 1, s = (TEX * BOX) / Math.max(bw, bh);
  var out = document.createElement("canvas"); out.width = out.height = TEX;
  var oc = out.getContext("2d", { willReadFrequently: true });

  oc.drawImage(source, TEX / 2 - (x0 + bw / 2 - dx0) * s, TEX / 2 - (y0 + bh / 2 - dy0) * s, sw * s0 * s, sh * s0 * s);

}
function edt1d(grid, offset, stride, f, v, z, INF) {
  v[0] = 0; z[0] = -INF; z[1] = INF; f[0] = grid[offset];
  for (var q = 1, k = 0, s = 0; q < TEX; q++) {
    f[q] = grid[offset + q * stride];
    var q2 = q * q, r;
    do { r = v[k]; s = (f[q] - f[r] + q2 - r * r) / (q - r) / 2; } while (s <= z[k] && --k > -1);
    k++; v[k] = q; z[k] = s; z[k + 1] = INF;
  }
  for (var q2 = 0, k2 = 0; q2 < TEX; q2++) {
    while (z[k2 + 1] < q2) k2++;

    grid[offset + q2 * stride] = f[r2] + qr * qr;
  }
}
function buildSdf(canvas) {
  var n = TEX * TEX;

  var INF = 1e20, outer = new Float64Array(n), inner = new Float64Array(n);
  for (var i = 0; i < n; i++) {
    var a = alpha[i * 4 + 3] / 255;
    if (a >= 1) { outer[i] = 0; inner[i] = INF; }
    else if (a <= 0) { outer[i] = INF; inner[i] = 0; }
    else { var dd = 0.5 - a; outer[i] = dd > 0 ? dd * dd : 0; inner[i] = dd < 0 ? dd * dd : 0; }
  }
  var f = new Float64Array(TEX), z = new Float64Array(TEX + 1), v = new Uint16Array(TEX);
  for (var x = 0; x < TEX; x++) { edt1d(outer, x, TEX, f, v, z, INF); edt1d(inner, x, TEX, f, v, z, INF); }
  for (var y = 0; y < TEX; y++) { edt1d(outer, y * TEX, 1, f, v, z, INF); edt1d(inner, y * TEX, 1, f, v, z, INF); }
  var sdf = new Float32Array(n);
  for (var k = 0; k < n; k++) sdf[k] = (Math.sqrt(outer[k]) - Math.sqrt(inner[k])) / TEX;
  return sdf;
}
function loadLogo(svgText) {
  return new Promise(function (res, rej) {
    var img = new Image();
    img.onload = function () {
      try { var c = fitToTexture(img, img.naturalWidth || TEX, img.naturalHeight || TEX); res({ canvas: c, sdf: buildSdf(c) }); }
      catch (e) { rej(e); }
    };
    img.onerror = function () { rej(new Error("logo load failed")); };
    img.src = svgToUrl(svgText);
  });
}

/* ---------------- spring timeline ---------------- */
var TAIL = 1.1, OUTRO = 0.5;
var clamp01 = function (x) { return x < 0 ? 0 : x > 1 ? 1 : x; };
var mix = function (a, b, t) { return a + (b - a) * t; };
var smooth = function (a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
var smoother = function (a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * t * (t * (t * 6 - 15) + 10); };
function hexToRgb(hex) {
  var h = hex.replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&");
  var v = parseInt(h.slice(0, 6), 16) || 0;
  return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255];
}
var luminance = function (c) { return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
function spring(t, response, damping) {

  var wd = w * Math.sqrt(1 - damping * damping);

var reachCache = {};
function timeToReach(level, response, damping) {

  if (reachCache[key] !== undefined) return reachCache[key];
  var lo = 0, hi = 3;
  for (var i = 0; i < 40; i++) { var mid = (lo + hi) / 2; if (spring(mid, response, damping) < level) lo = mid; else hi = mid; }

  var tl = timeToReach(0.85, P.response, damping) - 0.01;
  var tm = timeToReach(0.92, P.response, damping) - 0.01;
  var morph = spring(T - tm, 0.4, 1);
  var drop = 1 - smooth(0.05, 1, morph);
  var appear = smooth(0, 0.08, T);
  var drift = P.drift * spring(T - 0.3, 2.2, 1);
  var zoomIn = 0.25 * spring(T, 0.7, 1) + 0.75 * smoother(0, P.glide, T);
  var settle = spring(T - 0.5, 2.4, 1);
  var exit = spring(T - tx, 0.95, 1);
  var release = spring(T - tx - 0.05, 0.65, 1);
  var dome = 0.15 * P.bulge * (1 - smooth(0.4, 0.95, grow));
  /* the word gains presence while it writes on, then the release settles it */
  var wordZoom = 1;
  var view = (1 + (P.startZoom - 1) * (1 - zoomIn)) * (1 - 0.045 * settle) * wordZoom * mix(1, P.finalScale, exit) * (1 - 0.06 * outro);
  var bandW = mix(P.bevelWidth, Math.max(P.bevelWidth, 0.4), drop);
  var plateScale = mix(P.startSize, 1, grow) * (1 + drift) * (1 + 0.14 * release * (1 - keep)) * (1 - keep * (0.03 * release + 0.06 * outro));

    uPlateScale: plateScale, uShapeN: mix(2, P.corner, morph), uCornerN: P.corner,
    uOptics: 1 - smooth(0.55, 1, release),
    uPlateAlpha: keep ? appear * (1 - outro) : appear * (1 - smooth(0.45, 1, release)),
    uLogoHalf: P.logoScale * view,
    uLogoOff: [P.logoOffset[0] * view, P.logoOffset[1] * view],
    uKeep: keep, uSheen: P.sheen,
    uSweep: mix(-1.6, 1.6, smoother(0.9, tx - 0.1, T)),
    uLightAng: P.lightTurn * smoother(0.4, tx + 0.4, T),
    uBold: P.swell * 0.03 * (1 - zoomIn),
    uBlur: P.focus * 0.05 * (1 - smooth(0.3, 0.95, grow)) + 0.03 * outro,
    uFrost: P.focus * (1 - smooth(0.5, 0.95, grow)),
    uPinch: 0.38 * P.stretch * smooth(0.1, 0.9, morph) * smooth(0.75, 0.97, zoomIn),
    uTilt: P.tilt, uDome: dome, uDrop: drop, uRim: 1 + 0.8 * drop,
    uHalo: P.halo * (0.5 + 0.5 * drop) * (1 - keep * release),

    uGhost: smooth(0, 0.03, T) * (1 - smooth(0.04, 0.08, T)),

    uRipA: P.ripple * smooth(tl, tl + 0.06, T) * Math.exp(-Math.max(0, T - tl) / 0.6),

    uReach: bandW * plateScale, uCornerPull: P.cornerPull, uStreak: P.edgeSmear, uWiden: P.cornerWidth,
    uSlab: 0.3 * P.opticalDepth, uEtaSpread: 0.06, uFocus: P.cornerFocus, uFocusK: 1.0,
    uFocusSplit: 0.056 * P.colorBleed, uRimLine: 0.09, uCornerOn: smooth(0.35, 1, morph),

    uLightScene: luminance(bg) > 0.5 ? 1 : 0,
    uLightGlass: luminance(P.iconPlate ? hexToRgb(P.plateColor) : bg) > 0.5 ? 1 : 0,

}

/* ---------------- shader: 3 morph targets, staggered word wave ---------------- */
var VERT = "#version 300 es\nin vec2 aPos;\nvoid main() { gl_Position = vec4(aPos, 0.0, 1.0); }";
var FRAG = `#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 uCenter; uniform float uTile;
uniform sampler2D uSdf; uniform sampler2D uCol;
uniform sampler2D uSdf2; uniform sampler2D uCol2;
uniform sampler2D uSdf3; uniform sampler2D uCol3;
uniform float uMorph; uniform float uMorph2;
uniform float uTexSize; uniform float uBoxFrac;
uniform float uPlateScale; uniform float uShapeN; uniform float uCornerN; uniform float uOptics;
uniform float uPlateAlpha; uniform float uLogoHalf; uniform vec2 uLogoOff; uniform float uBold;
uniform float uBlur; uniform float uFrost; uniform float uDome; uniform float uDrop; uniform float uPinch;
uniform float uTilt; uniform float uRim; uniform float uHalo; uniform float uShadow; uniform float uGhost;
uniform float uRipR; uniform float uRipA; uniform float uBare; uniform float uReach; uniform float uCornerPull;
uniform float uStreak; uniform float uWiden; uniform float uSlab; uniform float uEtaSpread; uniform float uFocus;
uniform float uFocusK; uniform float uFocusSplit; uniform float uRimLine; uniform float uCornerOn;
uniform float uDissolve; uniform float uGlow; uniform float uFaceDisp; uniform float uVivid;
uniform float uDisp; uniform float uDouble; uniform float uBevelW; uniform float uSpec; uniform float uIconPlate;
uniform float uUseColor; uniform float uLightScene; uniform float uLightGlass; uniform float uKeep;
uniform float uSheen; uniform float uSweep; uniform float uLightAng;
uniform vec3 uBg; uniform vec3 uPlateCol; uniform vec3 uLogoCol;
float px;
vec2 rot(vec2 v, float a) { float c = cos(a), s = sin(a); return vec2(c * v.x - s * v.y, s * v.x + c * v.y); }
vec3 colChain(sampler2D tex, vec2 uv, float lod) {

  vec4 c2 = textureLod(tex, uv, 7.0);
  vec3 c = c2.rgb / max(c2.a, 1e-4);
  c = mix(c, c1.rgb / max(c1.a, 1e-4), smoothstep(0.0, 0.06, c1.a));

  return c;
}
vec4 logoAt(vec2 q, float blur, float aa) {

    float s1 = bw * 0.62;
    float w2 = bw * 0.22;

    vec2 gDome = -uDome * 2.0 * g * dg * step(g, 1.0);

    float rblur = uBlur + 0.05 * length(qc - p) + min(uGlow * uOptics * (1.0 - xf) * foot / px, 0.04);
    float cornerW = smoothstep(0.1, 0.9, 4.0 * nOut.x * nOut.x * nOut.y * nOut.y);

    vec2 ldir = rot(normalize(vec2(-0.62, 0.78)), uLightAng);
    float side = dot(nOut, ldir);
    float fres = pow(edge, 1.5);
    vec3 rim = rimCol * fres * (0.35 + 0.65 * max(side, -side * 0.8)) * uRim * 0.65;
    vec3 Hv = normalize(normalize(vec3(-0.45, 0.6, 0.66)) + vec3(0.0, 0.0, 1.0));

    float sweepD = dot(p / uPlateScale, normalize(vec2(0.8, 0.6))) - uSweep;
    float sheen = uSheen * glassAmt * exp(-sweepD * sweepD / 0.03) * (0.55 + 0.45 * (1.0 - x));

    float cov = clamp(0.5 - sd / soft, 0.0, 1.0);
    col = mix(bg, glass, cov);
  }
  vec3 outc = mix(plain, col, uPlateAlpha);
  outc += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
  outColor = vec4(outc, 1.0);
}`;

/* ---------------- boot ---------------- */
var stage = document.getElementById("stage");
// Adapted from the owner-supplied Qwen reveal. One bounded run; the parent
// owns skip, reduced motion, scroll locking and teardown of this sandbox.
var disposed = false, raf = 0, context;
function signal(type) { parent.postMessage({ source: "hyperchat-intro", type: type }, "*"); }
function dispose() {
  disposed = true; cancelAnimationFrame(raf);
  if (context) { var ext = context.getExtension("WEBGL_lose_context"); if (ext) ext.loseContext(); }
}
window.addEventListener("pagehide", dispose);
window.addEventListener("message", function (event) {
  if (event.source !== parent) return;
  if (event.data === "hyperchat-intro:stop") dispose();
  if (!disposed && !LOGO_A && event.data?.source === "hyperchat-intro" && event.data.type === "init" && typeof event.data.logo === "string") {
    LOGO_A = event.data.logo;
    boot();
  }
});

function cssFallback() { signal("fallback"); dispose(); }

function boot() {
  var canvas = document.createElement("canvas");
  canvas.setAttribute("aria-hidden", "true");
  stage.appendChild(canvas);
  var gl = canvas.getContext("webgl2", { antialias: false, premultipliedAlpha: false });
  if (!gl) { canvas.remove(); cssFallback(); return; }
  context = gl;
  canvas.addEventListener("webglcontextlost", function () { if (!disposed) cssFallback(); });
  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh) || "shader");
    return sh;
  }
  var prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || "program");
  } catch (err) { console.error(err); canvas.remove(); cssFallback(); return; }
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var U = {}, count = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (var i = 0; i < count; i++) { var info = gl.getActiveUniform(prog, i); U[info.name] = gl.getUniformLocation(prog, info.name); }
  gl.uniform1i(U.uSdf, 0); gl.uniform1i(U.uCol, 1);
  gl.uniform1i(U.uSdf2, 2); gl.uniform1i(U.uCol2, 3);
  gl.uniform1i(U.uSdf3, 4); gl.uniform1i(U.uCol3, 5);
  var tex = [];
  for (var ti = 0; ti < 6; ti++) tex.push(gl.createTexture());
  var hasLogo = false;
  function params(filter) {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tt);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, TEX, TEX, 0, gl.RED, gl.FLOAT, sdf);
    params(gl.LINEAR);

  function uploadCol(unit, tt, cvs) {
    gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tt);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, cvs);

    if (!hasLogo) return;
    var w = canvas.width, h = canvas.height;
    gl.viewport(0, 0, w, h);
    gl.uniform2f(U.uCenter, w / 2, h / 2);
    gl.uniform1f(U.uTile, tilePx);
    gl.uniform1f(U.uTexSize, TEX);
    gl.uniform1f(U.uBoxFrac, BOX);

    for (var k in fr) { var v = fr[k]; if (typeof v === "number" && U[k]) gl.uniform1f(U[k], v); }
    gl.uniform3fv(U.uBg, fr.uBg);
    gl.uniform3fv(U.uPlateCol, fr.uPlateCol);
    gl.uniform3fv(U.uLogoCol, fr.uLogoCol);

  function tick(now) {
    if (disposed) return;

    time = Math.min(END, (now - started) / 1000 * 1.7);
    var cw = canvas.clientWidth, ch = canvas.clientHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5, 1400 / cw, 1000 / ch);

    var tile = Math.min(900, cw * .88 / .68, ch * 1.25) * .5;
    render(tile * dpr);

    // Start the parent fade before stopping the renderer, so the glass never freezes.
    if (time >= FADE_AT && !finishing) { finishing = true; signal("complete"); }
    if (time >= END) return;
    raf = requestAnimationFrame(tick);
  }



  // Keep the supplied HyperChat wordmark throughout; no split textures.
  loadLogo(LOGO_A).then(function (logo) {
    var tri = [logo, logo, logo];
    if (disposed) return;
    uploadSdf(0, tex[0], tri[0].sdf); uploadCol(1, tex[1], tri[0].canvas);
    uploadSdf(2, tex[2], tri[1].sdf); uploadCol(3, tex[3], tri[1].canvas);
    uploadSdf(4, tex[4], tri[2].sdf); uploadCol(5, tex[5], tri[2].canvas);
    hasLogo = true;
    raf = requestAnimationFrame(tick);
  }).catch(function (err) { console.error(err); canvas.remove(); cssFallback(); });
}
