<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>html.app-booting .static-page{display:none}html.app-booting body{background:#221f1c}</style>
    <script>
      (() => {
        document.documentElement.classList.add('app-booting');
        const revealFallback = () => document.documentElement.classList.remove('app-booting');
        const deadline = setTimeout(revealFallback, 8000);
        document.addEventListener('hyperchat:ready', () => { clearTimeout(deadline); revealFallback(); }, { once: true });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=hc-transparent-3" />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" content="#221F1C" />
    <!-- SEO:START -->
    <meta name="description" content="HyperChat — live creator interactions through messages, voice, sound and media." />
    <meta name="robots" content="noindex, follow" />
    <title>HyperChat — Live interactions for creators</title>
    <!-- SEO:END -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
